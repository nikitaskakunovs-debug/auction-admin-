# Production stack — one droplet, five containers.
# Run from the deploy/ directory: docker compose -f docker-compose.prod.yml up -d
# Configuration comes from deploy/.env (copy .env.example and fill it in).
name: auction

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: auction
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://auction:${POSTGRES_PASSWORD}@postgres:5432/auction
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      CORS_ORIGINS: https://${DOMAIN},https://www.${DOMAIN},https://admin.${DOMAIN},https://wh.${DOMAIN}
      PUBLIC_BASE_URL: https://api.${DOMAIN}
      TRUST_PROXY: "1"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-fra1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # Meta Conversions API. Токен живёт ТОЛЬКО здесь, в deploy/.env на
      # сервере: во фронтенд, в GTM и в репозиторий он не попадает. Пусто —
      # серверная отправка выключена, браузерный пиксель работает как прежде.
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_DATASET_ID: ${META_DATASET_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      # Код тестовых событий — только на время проверки в Meta Test Events.
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      EMAIL_MODE: ${EMAIL_MODE:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Куда уходит ответ клиента на любое наше письмо (по умолчанию —
      # COMPANY_EMAIL). Секрет вебхука почты: путь отказов/жалоб от Resend
      # или SES. Оба живут только в deploy/.env.
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      # Ответы по «столам»: счета/возвраты, поддержка, поставщики. Пусто —
      # всё в общий EMAIL_REPLY_TO.
      EMAIL_REPLY_TO_BILLING: ${EMAIL_REPLY_TO_BILLING:-}
      EMAIL_REPLY_TO_SUPPORT: ${EMAIL_REPLY_TO_SUPPORT:-}
      EMAIL_REPLY_TO_PARTNERS: ${EMAIL_REPLY_TO_PARTNERS:-}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
      BUY_NOW_DEADLINE_HOURS: ${BUY_NOW_DEADLINE_HOURS:-24}
      # Партнёрский кабинет живёт на своём имени; ссылки в письмах поставщикам.
      SUPPLIER_PORTAL_URL: ${SUPPLIER_PORTAL_URL:-https://partner.${DOMAIN}}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      VIES_MODE: live
      # Klix payments (off until the merchant keys arrive; then KLIX_MODE=live).
      STOREFRONT_BASE_URL: https://${DOMAIN}
      ADMIN_BASE_URL: https://admin.${DOMAIN}
      # What the customer emails print about us. Set these in deploy/.env —
      # they appear in every message's footer, so a wrong address is visible
      # to every buyer.
      COMPANY_NAME: ${COMPANY_NAME:-Izsoli.lv}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME:-SIA Izsoli}
      COMPANY_REG_NO: ${COMPANY_REG_NO:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-info@izsoli.lv}
      PICKUP_ADDRESS: ${PICKUP_ADDRESS:-}
      PICKUP_HOURS: ${PICKUP_HOURS:-}
      # Optional: a PNG illustration for the email header, and social links.
      # Left empty, the emails simply render without them.
      EMAIL_HERO_URL: ${EMAIL_HERO_URL:-}
      SOCIAL_FACEBOOK_URL: ${SOCIAL_FACEBOOK_URL:-}
      SOCIAL_INSTAGRAM_URL: ${SOCIAL_INSTAGRAM_URL:-}
      REVIEW_URL: ${REVIEW_URL:-}
      KLIX_MODE: ${KLIX_MODE:-off}
      # Point at Klix's test portal while trialling; unset uses production.
      KLIX_API_URL: ${KLIX_API_URL:-}
      KLIX_BRAND_ID: ${KLIX_BRAND_ID:-}
      KLIX_SECRET_KEY: ${KLIX_SECRET_KEY:-}
      KLIX_METHODS: ${KLIX_METHODS:-}
      # Inbank BNPL (off until the partner credentials arrive; then INBANK_MODE=live).
      INBANK_MODE: ${INBANK_MODE:-off}
      INBANK_API_URL: ${INBANK_API_URL:-}
      INBANK_SHOP_UUID: ${INBANK_SHOP_UUID:-}
      INBANK_API_KEY: ${INBANK_API_KEY:-}
      INBANK_PRODUCT_CODE: ${INBANK_PRODUCT_CODE:-}
      # Omniva parcel shipping (off until the business contract; then OMNIVA_MODE=live).
      OMNIVA_MODE: ${OMNIVA_MODE:-off}
      OMNIVA_API_URL: ${OMNIVA_API_URL:-}
      OMNIVA_USERNAME: ${OMNIVA_USERNAME:-}
      OMNIVA_PASSWORD: ${OMNIVA_PASSWORD:-}
      SHIP_SENDER_NAME: ${SHIP_SENDER_NAME:-}
      SHIP_SENDER_PHONE: ${SHIP_SENDER_PHONE:-}
      SHIP_SENDER_EMAIL: ${SHIP_SENDER_EMAIL:-}
      SHIP_SENDER_COUNTRY: ${SHIP_SENDER_COUNTRY:-LV}
      SHIP_SENDER_POSTCODE: ${SHIP_SENDER_POSTCODE:-}
      SHIP_SENDER_CITY: ${SHIP_SENDER_CITY:-}
      SHIP_SENDER_STREET: ${SHIP_SENDER_STREET:-}
      # DPD parcel lockers (off until the business contract; then DPD_MODE=live).
      DPD_MODE: ${DPD_MODE:-off}
      DPD_API_URL: ${DPD_API_URL:-}
      DPD_API_TOKEN: ${DPD_API_TOKEN:-}
      DPD_SERVICE_ALIAS: ${DPD_SERVICE_ALIAS:-}
      # Social sign-in (№ 50, 52–54). Each provider switches on by its own key
      # pair from deploy/.env; a provider without keys shows an honest
      # "still being connected" toast instead of a broken button.
      SOCIAL_MODE: ${SOCIAL_MODE:-off}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      # Jira problem reports (off until the integration account token; then JIRA_MODE=live).
      JIRA_MODE: ${JIRA_MODE:-off}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT: ${JIRA_PROJECT:-IZS}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
      # Slack mirroring (off until the bot token; then SLACK_MODE=live).
      SLACK_MODE: ${SLACK_MODE:-off}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ORDERS: ${SLACK_CHANNEL_ORDERS:-#orders}
      SLACK_CHANNEL_WAREHOUSE: ${SLACK_CHANNEL_WAREHOUSE:-#warehouse}
      SLACK_CHANNEL_BUGS: ${SLACK_CHANNEL_BUGS:-#bugs}
      # Sentry error monitoring (off until SENTRY_DSN is set).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      # Only used if STORAGE_DRIVER=local; harmless otherwise.
      - uploads:/repo/apps/api/var/uploads

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_ORIGIN_LV: ${ORIGIN_LV:-https://${DOMAIN}}
        NEXT_PUBLIC_ORIGIN_EE: ${ORIGIN_EE:-https://${DOMAIN}}
        NEXT_PUBLIC_ORIGIN_LT: ${ORIGIN_LT:-https://${DOMAIN}}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_WEB:-}
        # Google Tag Manager (аналитика и пиксели, Consent Mode внутри).
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-GTM-WGN2M7KZ}
        # Meta PageView. Включать ТОЛЬКО после публикации изменений GTM, где
        # базовый тег переведён на событие meta_page_view и получает eventID:
        # иначе просмотр посчитается дважды. Значение попадает в сборку, а не
        # в рантайм, поэтому смена требует пересборки web.
        NEXT_PUBLIC_META_PAGEVIEW: ${NEXT_PUBLIC_META_PAGEVIEW:-0}
        # Google AdSense: базовый скрипт в <head> (верификация сайта).
        # Auto Ads не включаются; рекламные места — только будущими
        # <AdSenseSlot /> под отдельным флагом.
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-ca-pub-9932986165940423}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_URL: http://api:4000

  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
      args:
        VITE_SENTRY_DSN: ${SENTRY_DSN_ADMIN:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
    depends_on:
      - api
      - web
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
